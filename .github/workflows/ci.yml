name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.70.0"
      - run: buf lint proto
      - run: buf generate proto
      - name: Verify generated stubs are committed
        run: |
          git diff --exit-code -- \
            services/ai-service/app/grpc/gen/ \
            backend/src/ai/grpc/gen/

  shared-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared

  email-service:
    runs-on: ubuntu-latest
    needs: shared-package
    defaults:
      run:
        working-directory: services/email-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/email-service/package-lock.json
      - run: npm ci
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared
      - run: npm ci
      - run: npm test

  backend-unit:
    runs-on: ubuntu-latest
    needs: shared-package
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared
      - run: npm ci
      - run: npm run test:unit

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      # `next build` is the only thing that type-checks the frontend. Without
      # it a type error merges cleanly and fails at deploy — which is exactly
      # how the build came to be broken before this job existed.
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    needs: shared-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared
      - run: npm ci
        working-directory: backend
      # Non-mutating: the package `lint` script passes --fix, which CI must not.
      - run: npm run lint:ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint:ci
        working-directory: frontend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Runtime dependencies only: a dev-only advisory should not block a
      # release, and --omit=dev keeps this signal one people act on.
      - name: backend
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend
      - name: frontend
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
      - name: email-service
        run: npm audit --audit-level=high --omit=dev
        working-directory: services/email-service

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check app tests
