syntax = "proto3";

package folio.ai.v1;

// PlagiarismService exposes corpus similarity (chunk-level) to internal callers (Nest backend).
service PlagiarismService {
  rpc DetectCorpusSimilarity(DetectCorpusSimilarityRequest) returns (DetectCorpusSimilarityResponse);
  rpc GetPlagiarismStatus(GetPlagiarismStatusRequest) returns (PlagiarismStatus);
}

message DetectCorpusSimilarityRequest {
  string submission_text = 1;
  optional double threshold = 2;
  optional string category = 3;
  // Excluded from exact matching so a resubmission or a re-check of an already
  // indexed article does not match itself at 100%.
  optional string submission_id = 4;
}

message CorpusSimilarityMatch {
  int32 submission_chunk_index = 1;
  string submission_snippet = 2;
  string source_article_id = 3;
  int32 source_chunk_index = 4;
  string matched_snippet = 5;
  double similarity = 6;
}

message WebSimilarityMatch {
  string query_snippet = 1;
  string source_url = 2;
  string matched_snippet = 3;
  double similarity = 4;
}

// One verbatim run shared between the manuscript and a corpus document.
// Positions are token indices into the normalized text, so the UI can highlight.
message ExactMatchSpan {
  int32 submission_start_token = 1;
  int32 submission_end_token = 2;
  string submission_snippet = 3;
  string matched_snippet = 4;
  int32 token_length = 5;
  // Inside quotation marks: attribution, reported separately from copying.
  bool quoted = 6;
}

message ExactMatchSource {
  string doc_id = 1;
  // folio_submission | back_catalog | external_oa | web
  string source_kind = 2;
  string source_ref = 3;
  string title = 4;
  string source_url = 5;
  // Set only when the source is a Folio submission, so the backend can re-check
  // that it is still published before showing anything.
  optional string submission_id = 6;
  int32 matched_tokens = 7;
  double overlap_ratio = 8;
  repeated ExactMatchSpan spans = 9;
}

message ExactMatchReport {
  int32 total_tokens = 1;
  int32 matched_tokens = 2;
  // Share of the manuscript covered by verbatim runs, de-duplicated across
  // sources — the same passage found on five mirrors counts once.
  double overall_ratio = 3;
  int32 quoted_tokens = 4;
  int32 reference_tokens_skipped = 5;
  repeated ExactMatchSource sources = 6;
}

message DetectCorpusSimilarityResponse {
  repeated CorpusSimilarityMatch local_matches = 1;
  repeated WebSimilarityMatch web_matches = 2;
  optional string local_error = 3;
  optional string web_error = 4;
  optional ExactMatchReport exact_matches = 5;
  optional string exact_error = 6;
}

message PlagiarismStatus {
  bool enabled = 1;
}

message GetPlagiarismStatusRequest {}
