# Local development infrastructure for Folio.
#
# Provides PostgreSQL, RabbitMQ, LanguageTool, and Typesense so you can run
# the app services (backend, frontend, email-service, ai-service) natively
# with hot reload.  Run all infra:
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Or start individually, e.g.:
#   docker compose -f docker-compose.dev.yml up -d postgres
#   docker compose -f docker-compose.dev.yml up -d postgres-email
#   docker compose -f docker-compose.dev.yml up -d rabbitmq
#   docker compose -f docker-compose.dev.yml up -d languagetool
#   docker compose -f docker-compose.dev.yml up -d typesense
#
# To run EVERYTHING in Docker (infra + all app services) use the full stack
# compose instead:
#
#   docker compose -f docker-compose.local.yml up
#
# NOTE: Do not run both files simultaneously — they share ports 5432 and 5672.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: folio-postgres
    # Host 5434 avoids clashing with a local PostgreSQL install on 5432 (common on Windows).
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: folio_review
    volumes:
      - folio-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-email:
    image: postgres:17-alpine
    container_name: folio-postgres-email
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: folio_email
    volumes:
      - folio-postgres-email-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: folio-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - folio-rabbitmq-data:/var/lib/rabbitmq

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: folio-languagetool
    ports:
      - "8010:8010"
    environment:
      # Omit langtool_languageModel unless you mount ngram data (see image docs).
      - Java_Xms=256m
      - Java_Xmx=512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/v2/languages | grep -q 'name'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Full-text search engine. Enable with TYPESENSE_ENABLED=true in backend/.env.
  # API key matches the default in backend/.env.example.
  typesense:
    image: typesense/typesense:26.0
    container_name: folio-typesense
    ports:
      - "8108:8108"
    command: >
      --data-dir /data
      --api-key=xyz
      --enable-cors
    volumes:
      - folio-typesense-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8108/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  folio-postgres-data:
  folio-postgres-email-data:
  folio-rabbitmq-data:
  folio-typesense-data:
