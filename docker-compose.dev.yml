# Local development infrastructure for Folio.
#
# Provides RabbitMQ (email pipeline) and LanguageTool (copyedit grammar checks).
# Run all services:
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Or start individually, e.g.:
#   docker compose -f docker-compose.dev.yml up -d rabbitmq
#   docker compose -f docker-compose.dev.yml up -d languagetool
#
# A production compose file is intentionally NOT included yet; that
# lives with the deployment story (see docs/plans/email-service.md).

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: folio-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - folio-rabbitmq-data:/var/lib/rabbitmq

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: folio-languagetool
    ports:
      - "8010:8010"
    environment:
      # Omit langtool_languageModel unless you mount ngram data (see image docs).
      - Java_Xms=256m
      - Java_Xmx=512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/v2/languages | grep -q 'name'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  folio-rabbitmq-data:
