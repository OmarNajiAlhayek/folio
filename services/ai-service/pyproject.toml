[project]
name = "folio-ai-service"
version = "0.1.0"
description = "Damascus University Journal AI microservice: FastAPI scaffold with pluggable LLM providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.55.0",
  "python-dotenv>=1.0.0",
  "grpcio>=1.68.0",
  "grpcio-status>=1.68.0",
  "protobuf>=6.31.1,<7.0dev",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-grpc>=0.50b0",
]

[project.optional-dependencies]
ml = [
  # Pin to the training/eval stack used with the fine-tuned AraBERT weights
  # (Muhyiddin): torch 2.5.1+cu121, transformers 4.57.6, arabert 1.0.1.
  # Install torch from the cu121 index first, then: pip install -e ".[ml]"
  "torch==2.5.1",
  "transformers==4.57.6",
  "arabert==1.0.1",
  "safetensors>=0.4.0",
]
similarity = [
  "psycopg[binary,pool]>=3.2.0",
  "pgvector>=0.3.6",
  "sentence-transformers>=3.3.0",
  "pyarabic>=0.6.15",
]
web_similarity = [
  "google-api-python-client>=2.150.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
  "farasapy>=0.0.14",
  "pyarabic>=0.6.15",
]
# Exact-overlap corpus: fingerprint index plus the importers that fill it.
# Deliberately free of torch/transformers — exact matching needs no embeddings,
# so a deployment can run plagiarism checks without the ML stack.
corpus = [
  "psycopg[binary,pool]>=3.2.0",
  "pymupdf>=1.24.0",
  "pypdf>=5.0.0",
  "requests>=2.32.0",
]
# OCR fallback for PDFs with a broken font encoding.
# Tesseract also needs the host binary + `ara` traineddata.
# Surya is the preferred free engine (GPU, strong Arabic); Tesseract is the fallback.
# Pin <0.20: Surya 2+ (0.20+) requires a vLLM Docker / llama.cpp server and
# changed the Python API (FoundationPredictor → SuryaInferenceManager,
# text_lines → blocks). Our SuryaEngine targets the 0.17 torch-local API.
ocr = [
  "surya-ocr>=0.17.0,<0.20",
  # Surya 0.17 breaks on transformers 5.x (pad_token_id / removed utils).
  "transformers>=4.56.1,<5",
  "pytesseract>=0.3.13",
  "pillow>=10.2.0,<11",
  "pymupdf>=1.24.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "grpcio-reflection>=1.68.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "ml: full AraBERT inference (requires pip install -e \".[ml]\" and local weights)",
  "similarity: pgvector + sentence-transformers (requires pip install -e \".[similarity]\")",
  "web_similarity: Google CSE + AraBERT web check (requires pip install -e \".[ml,web_similarity]\")",
  "corpus: exact-match corpus against a live Postgres (requires pip install -e \".[corpus]\")",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/grpc/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
